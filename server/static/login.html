<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-ink Status Board — 로그인</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg-base: #07070e;
      --bg-surface: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --gradient: linear-gradient(135deg, #7c3aed, #4f46e5);
      --accent-glow: rgba(124, 58, 237, 0.25);
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      top: -30%; right: -10%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.10), transparent 70%);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .mark {
      width: 64px; height: 38px;
      margin: 0 auto 20px;
      border: 2px solid var(--text-secondary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; letter-spacing: 2px; color: var(--text-secondary);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p.sub { margin-top: 8px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      margin-top: 28px;
      padding: 13px 20px;
      border: none; border-radius: 10px;
      background: var(--gradient);
      color: #fff; font-size: 15px; font-weight: 600; font-family: inherit;
      text-decoration: none; cursor: pointer;
      box-shadow: 0 2px 12px var(--accent-glow);
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }
    .btn:hover { box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4); }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 18px; height: 18px; flex: none; }
    p.note { margin-top: 18px; font-size: 12px; color: var(--text-muted); line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">E-INK</div>
    <h1>E-ink Status Board</h1>
    <p class="sub">전자잉크 상태 표시판 관리자</p>
    <a class="btn" href="/login">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" opacity=".95"/><path fill="#fff" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6C4.8 19.8 8.2 22 12 22z" opacity=".8"/><path fill="#fff" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1C2.4 8.8 2 10.4 2 12s.4 3.2 1.1 4.6L6.4 14z" opacity=".65"/><path fill="#fff" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8.2 2 4.8 4.2 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" opacity=".5"/></svg>
      Google 계정으로 로그인
    </a>
    <p class="note">허용된 Google 계정만 들어올 수 있습니다.<br>로그인 상태는 30일 동안 유지됩니다.</p>
  </main>
</body>
</html>
