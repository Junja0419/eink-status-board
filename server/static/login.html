<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#010102">
  <title>E-ink Status Board — 로그인</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* 색·글꼴 값은 admin.html 의 디자인 토큰과 같다 */
    :root {
      --canvas: #010102;
      --hairline: #23252a;
      --ink: #f7f8f8;
      --ink-subtle: #8a8f98;
      --primary: #5e6ad2;
      --primary-hover: #828fff;
      --primary-focus: #5e69d1;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .mark {
      display: block;
      margin: 0 auto 28px;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.6px;
    }
    .sub {
      margin-top: 8px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink-subtle);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 40px;
      margin-top: 32px;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { background: var(--primary-focus); }
    .btn:focus-visible { outline: 2px solid var(--primary-hover); outline-offset: 2px; }
    .btn svg { width: 16px; height: 16px; flex: none; }
    .note {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--hairline);
      font-size: 12px;
      line-height: 1.6;
      color: var(--ink-subtle);
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/favicon.svg" width="48" height="48" alt="">
    <h1>E-ink Status Board</h1>
    <p class="sub">전자잉크 상태 표시판 관리자</p>
    <a class="btn" href="/login">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" opacity=".95"/><path fill="#fff" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6C4.8 19.8 8.2 22 12 22z" opacity=".8"/><path fill="#fff" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1C2.4 8.8 2 10.4 2 12s.4 3.2 1.1 4.6L6.4 14z" opacity=".65"/><path fill="#fff" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8.2 2 4.8 4.2 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" opacity=".5"/></svg>
      Google 계정으로 로그인
    </a>
    <p class="note">허용된 Google 계정만 들어올 수 있습니다.<br>로그인 상태는 30일 동안 유지됩니다.</p>
  </main>
</body>
</html>
